# SMS Gateway — Cloudflare Worker 配置
# 通过 Cloudflare API / wrangler 均可部署；密钥走 Secrets，不写入本文件
# 本文件位于 platforms/cloudflare/，main 指向同目录 worker.js；在本目录内执行 wrangler 命令即可
name = "sms-gateway"
main = "worker.js"
compatibility_date = "2026-09-01"

# 每天 UTC 17:00（北京时间凌晨 1 点）清理超过保留天数的线上短信
[triggers]
crons = ["0 17 * * *"]

# 可配置变量（也可部署后在 Dashboard → Worker → Settings → Variables 中修改，改完即时生效，无需改代码）
[vars]
# 数据保留天数：定时任务每天删除超过该天数的短信
RETENTION_DAYS = "30"
# 管理页登录开关："true" 访问页面需输入密码（密码用 Secret ADMIN_PASSWORD 设置）；"false" 免登录
# 默认 "true"（安全优先）：未配置 ADMIN_PASSWORD 时不会锁死——自动按免登录运行并输出告警，配好密码即生效
# 注意：通过 Workers Builds / wrangler 部署时，此文件优先于 Dashboard 里手动改的变量值
ENABLE_AUTH = "true"

[[d1_databases]]
binding = "DB"
database_name = "sms-gateway-db"
# database_id：替换为你自己的 D1 数据库 ID（创建数据库后在详情页可见，见 README 第一步）
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Secrets（wrangler secret put / API 创建）：
#   RECEIVE_TOKEN — SmsForwarder 推送鉴权 token
# 通知转发渠道（可选）：FEISHU_WEBHOOK / WECOM_WEBHOOK / DINGTALK_WEBHOOK / SERVERCHAN_SENDKEY /
#   PUSHPLUS_TOKEN / TELEGRAM_BOT_TOKEN+TELEGRAM_CHAT_ID / BARK_DEVICE_KEY / NTFY_URL /
#   GOTIFY_URL+GOTIFY_TOKEN / RESEND_API_KEY+MAIL_TO / GENERIC_WEBHOOKS 等，配置哪个转发哪个（见 README 第五步）
# 自定义域名：绑定 Custom Domain 后 DNS 自动创建（见 README 第七步）
